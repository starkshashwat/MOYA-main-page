[build]
  command = "npm run build"
  publish = "dist"

[[redirects]]
  from = "/index.html"
  to = "/"
  status = 301
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/lead-complete.html"
  [headers.values]
    Content-Security-Policy = "frame-ancestors 'self' https://pay.mechanismofya.com"
    Cache-Control = "no-store"
    X-Robots-Tag = "noindex, nofollow"
