server {
    listen 80;
    listen [::]:80;
    listen 3000;
    listen [::]:3000;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    absolute_redirect off;

    # Coolify terminates TLS and should enforce HTTPS at its proxy.
    if ($host = www.mechanismofya.com) {
        return 308 https://mechanismofya.com$request_uri;
    }

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "frame-ancestors 'self'" always;
    add_header Cache-Control "public, max-age=0, must-revalidate" always;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/xml application/javascript image/svg+xml;

    location = /health { access_log off; default_type text/plain; return 200 'OK'; }
    # Serve Home in this context so index processing cannot hit the /index.html redirect.
    location = / { try_files /index.html =404; }
    location = /index.html { return 308 /$is_args$args; }
    location = /services { return 308 /services.html$is_args$args; }
    location = /services/ { return 308 /services.html$is_args$args; }
    location = /events { return 308 /events.html$is_args$args; }
    location = /events/ { return 308 /events.html$is_args$args; }
    location = /lead-complete { return 308 /lead-complete.html$is_args$args; }

    # Allow the completion relay in our own modal or GHL's nested form frame.
    # No site-wide relaxation of framing is necessary.
    location = /lead-complete.html {
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Content-Security-Policy "frame-ancestors 'self' https://pay.mechanismofya.com" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Cache-Control "no-store" always;
        try_files $uri =404;
    }

    location ~ /\. { deny all; }
    location / { try_files $uri $uri/ =404; }
    location ~* \.(webp|png|jpg|jpeg|ico|svg|woff2?)$ {
        expires 7d;
        try_files $uri =404;
    }
    error_page 404 /404.html;
}
